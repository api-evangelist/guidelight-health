name: Guidelight Health
description: 'Guidelight Health is a mental healthcare provider delivering evidence-based day treatment
  programs — Partial Hospitalization Programs (PHPs) and Intensive Outpatient Programs (IOPs) — for
  people managing anxiety, depression, trauma, PTSD, and personality disorders. Care combines group
  therapy, individual psychotherapy, and medication management, offered in-person and virtually across
  Colorado, California, Massachusetts, North Carolina, and Washington. Backed by GV (Google Ventures),
  the company operates a patient-facing clinical service rather than a public developer API; its client
  portal runs on the third-party Kipu (kipuworks.com) EHR platform, so there is no first-party API,
  SDK, or developer surface to catalog at this time.'
